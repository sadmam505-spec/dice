<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
		<title>3D Lucky Roller - Premium</title>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
		<style>
			* { box-sizing: border-box; }
			body {
			background-color: #000;
			color: #fff;
			font-family: 'Inter', sans-serif;
			margin: 0;
			padding: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			overflow: hidden;
			}

			.phone-container {
			width: 100%;
			height: 100%;
			max-width: 400px;
			background-color: #000;
			border: 2px solid #333;
			border-radius: 30px;
			overflow: hidden;
			display: flex;
			flex-direction: column;
			box-shadow: 0 10px 30px rgba(0,0,0,0.5);
			}
			

			.top-bar {
			width: 100%;
			padding: 15px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			}
			.back-btn { color: #f39c12; text-decoration: none; font-size: 1.2rem; cursor: pointer; }

			.stats-container {
			width: 90%;
			align-self: center;
			background: #111;
			border: 1px solid #333;
			border-radius: 15px;
			padding: 15px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-top: 10px;
			}
			.point-box { color: #f39c12; font-weight: bold; }

			.claim-btn {
			background: #27ae60;
			color: white;
			border: none;
			padding: 8px 15px;
			border-radius: 20px;
			font-size: 0.8rem;
			font-weight: bold;
			cursor: pointer;
			transition: transform 0.1s;
			}
			.claim-btn:active { transform: scale(0.9); }

			.game-area {
			flex: 1;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			width: 100%;
			perspective: 1200px;
			}

			.dice-wrapper {
			display: flex;
			gap: 50px;
			height: 100px;
			align-items: center;
			}

			.dice-container {
			width: 60px;
			height: 60px;
			position: relative;
			transform-style: preserve-3d;
			transition: transform 1.5s cubic-bezier(0.1, 0.5, 0.3, 1);
			}

			/* Initial hidden state to simulate falling from top */
			.initial-pos { transform: translateY(-500px) rotateX(45deg) rotateY(45deg); }

			.face {
			position: absolute;
			width: 60px;
			height: 60px;
			background: #fff;
			border: 1px solid #ddd;
			border-radius: 10px;
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			grid-template-rows: repeat(3, 1fr);
			padding: 6px;
			box-shadow: inset 0 0 10px rgba(0,0,0,0.15);
			backface-visibility: hidden;
			}

			.dot { width: 10px; height: 10px; background: #000; border-radius: 50%; justify-self: center; align-self: center; }

			.front  { transform: rotateY(0deg) translateZ(30px); }
			.back   { transform: rotateY(180deg) translateZ(30px); }
			.right  { transform: rotateY(90deg) translateZ(30px); }
			.left   { transform: rotateY(-90deg) translateZ(30px); }
			.top    { transform: rotateX(90deg) translateZ(30px); }
			.bottom { transform: rotateX(-90deg) translateZ(30px); }

			/* Fast Spin Animation */
			.rolling-fast {
			animation: fastSpin 0.3s infinite linear;
			}

			@keyframes fastSpin {
			0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
			100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
			}

			/* --- শুধু কন্ট্রোল সেকশনের এই অংশটুকু পরিবর্তন করুন --- */
			.controls {
			width: 100%;
			padding: 20px;
			display: flex;
			justify-content: center; /* বাটনকে মাঝখানে রাখবে */
			align-items: center;
			background: #050505;
			margin-top: auto;
			
			padding-bottom: 110px;
			position: relative; /* লাইফ বক্সকে কন্ট্রোল করার জন্য */
			}

			.roll-btn {
			background: linear-gradient(45deg, #f39c12, #e67e22);
			color: white;
			border: none;
			padding: 15px 40px;
			font-size: 1.1rem;
			border-radius: 30px;
			font-weight: bold;
			cursor: pointer;
			transition: transform 0.1s;
			min-width: 160px;
			}

			.life-box {
			position: absolute; /* লাইফ বক্সকে বাটনের ওপর নির্ভর না করে আলাদা করে ফেললাম */
			right: 60px; /* একদম ডান পাশে থাকবে */
			display: flex;
			align-items: center;
			gap: 8px;
			font-size: 1.2rem;
			font-weight: bold;
			}

			.roll-btn {
			background: linear-gradient(45deg, #f39c12, #e67e22);
			color: white; border: none; padding: 15px 35px;
			font-size: 1.1rem; border-radius: 30px; font-weight: bold;
			cursor: pointer; transition: transform 0.1s;
			}
			.roll-btn:active { transform: scale(0.9); }
			.roll-btn:disabled { background: #333; cursor: not-allowed; }

			.life-box { display: flex; align-items: center; gap: 5px; font-size: 1.2rem; font-weight: bold; }
			.fa-heart { color: #e74c3c; }

			#status { color: #555; font-size: 0.9rem; margin-top: 20px; font-weight: 500; }
		</style>
	</head>
	<body>

		<div class="phone-container">

			<div id="top-ad-placement" style="width: 100%; display: flex; flex-direction: column; align-items: center; background: #000; padding-top: 5px; border-bottom: 1px solid #111; margin-bottom: 15px;">
				<span style="color: #333; font-size: 8px; margin-bottom: 2px; letter-spacing: 1px; font-weight: bold;">ADVERTISEMENT</span>

				<div style="width: 320px; height: 50px; background: #0a0a0a; border: 1px solid #222; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #444; font-size: 11px;">
					320 x 50 Banner Ad
				</div>
			</div>
			
			<div class="top-bar">
				<a href="index.html" class="back-btn">
					<i class="fa-solid fa-arrow-left"></i>
				</a>
				<div style="color: #888; font-size: 0.9rem;">Dice Master</div>
				<div style="width: 20px;"></div>
				
			</div>

			<div class="stats-container">
				<div class="point-box">
					<i class="fa-solid fa-coins"></i> <span id="user-points">4</span>
				</div>
				<button class="claim-btn">Claim Reward</button>
			</div>

	

			<div class="game-area">
				<div id="drop-zone" style="position: absolute; top: 15%; transition: transform 1s;">
					<div class="dice-wrapper">
						<div id="dice1" class="dice-container initial-pos">
							<div class="face front"></div>
							<div class="face back"></div>
							<div class="face right"></div>
							<div class="face left"></div>
							<div class="face top"></div>
							<div class="face bottom"></div>
						</div>
						<div id="dice2" class="dice-container initial-pos">
							<div class="face front"></div>
							<div class="face back"></div>
							<div class="face right"></div>
							<div class="face left"></div>
							<div class="face top"></div>
							<div class="face bottom"></div>
						</div>
					</div>
				</div>
				<p id="status" style="position: absolute; bottom: 1%;">Feeling lucky? Roll the dice!</p>
			</div>

			<div class="controls">
				<button class="roll-btn" onclick="startRoll()">ROLL DICE</button>
				<div class="life-box">
					<i class="fa-solid fa-heart"></i>
					<span id="life-count">5</span>
				</div>
			</div>
		</div>

		<script>
			function getDotsHTML(num) {
			const positions = {
			1: [5],
			2: [1, 9],
			3: [1, 5, 9],
			4: [1, 3, 7, 9],
			5: [1, 3, 5, 7, 9],
			6: [1, 3, 4, 6, 7, 9]
			};
			let html = '';
			for (let i = 1; i <= 9; i++) {
			if (positions[num].includes(i)) html += `<div class="dot" style="grid-area: ${Math.ceil(i/3)}/${(i-1)%3+1}"></div>`;
			}
			return html;
			}

			function shuffleDiceFaces(diceId) {
			const faces = ['front', 'back', 'right', 'left', 'top', 'bottom'];
			const dice = document.getElementById(diceId);
			faces.forEach(faceClass => {
			const randomNum = Math.floor(Math.random() * 6) + 1;
			dice.querySelector('.' + faceClass).innerHTML = getDotsHTML(randomNum);
			});
			}

			function getWeightedResult() {
			const chance = Math.random() * 100;

			// 5% chance for 6+6
			if (chance <= 5) return [6, 6];

			// 25% chance for same numbers (but not 6+6)
			if (chance <= 30) {
			const num = Math.floor(Math.random() * 5) + 1;
			return [num, num];
			}

			// 25% chance for both even numbers
			if (chance <= 55) {
			const evens = [2, 4, 6];
			return [evens[Math.floor(Math.random()*3)], evens[Math.floor(Math.random()*3)]];
			}

			// Random numbers for the rest
			return [Math.floor(Math.random()*6)+1, Math.floor(Math.random()*6)+1];
			}

			function startRoll() {
			const d1 = document.getElementById('dice1');
			const d2 = document.getElementById('dice2');
			const btn = document.querySelector('.roll-btn');
			const status = document.getElementById('status');

			btn.disabled = true;
			status.innerText = "Shuffle...";

			// Start Shuffling and Rolling
			const shuffleInterval = setInterval(() => {
			shuffleDiceFaces('dice1');
			shuffleDiceFaces('dice2');
			}, 100);

			// Animation: Falling from top and spinning fast
			d1.style.transition = "none";
			d2.style.transition = "none";
			d1.className = "dice-container rolling-fast";
			d2.className = "dice-container rolling-fast";

			setTimeout(() => {
			clearInterval(shuffleInterval);
			const [res1, res2] = getWeightedResult();

			// Set the specific result to the 'front' face before stopping
			d1.querySelector('.front').innerHTML = getDotsHTML(res1);
			d2.querySelector('.front').innerHTML = getDotsHTML(res2);

			// Stop at front face
			d1.className = "dice-container";
			d2.className = "dice-container";
			d1.style.transition = "transform 1s cubic-bezier(0.17, 0.67, 0.83, 0.67)";
			d2.style.transition = "transform 1s cubic-bezier(0.17, 0.67, 0.83, 0.67)";

			// Final Landing Position (Front Face)
			d1.style.transform = "translateY(0) rotateX(0deg) rotateY(0deg)";
			d2.style.transform = "translateY(0) rotateX(0deg) rotateY(0deg)";

			status.innerText = `Landed: ${res1} & ${res2}!`;
				btn.disabled = false;
				}, 3500);
				}

			
			window.onload = () => {
			// ১. ব্যালেন্স ০ সেট করা
			const pointElement = document.getElementById('user-points');
			if(pointElement) pointElement.innerText = "0";

			// ২. ডাইসগুলোর রেফারেন্স নেওয়া
			const d1 = document.getElementById('dice1');
			const d2 = document.getElementById('dice2');

			if(d1 && d2) {
			// ৩. ডাইস ১ এবং ২ এর সামনে ৬ সেট করা
			d1.querySelector('.front').innerHTML = getDotsHTML(6);
			d2.querySelector('.front').innerHTML = getDotsHTML(6);

			// ৪. ডাইসগুলোকে তাদের জায়গায় স্থির করে দেওয়া (যাতে শুরুতে ৬-৬ দেখা যায়)
			d1.className = "dice-container";
			d2.className = "dice-container";
			d1.style.transform = "translateY(0) rotateX(0deg) rotateY(0deg)";
			d2.style.transform = "translateY(0) rotateX(0deg) rotateY(0deg)";

			// ৫. বাকি পাশগুলোতে রেন্ডম ডট দিয়ে রাখা (ঘোরার সময়ের জন্য)
			shuffleDiceFaces('dice1');
			shuffleDiceFaces('dice2');

			// আবার ফ্রন্ট সাইড ৬ নিশ্চিত করা
			d1.querySelector('.front').innerHTML = getDotsHTML(6);
			d2.querySelector('.front').innerHTML = getDotsHTML(6);
			}
			};

			</script>
	</body>
</html>
